<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرد المخزون</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--bd:#dde1e6;--ac:#0b6bcb;--ok:#14803c;--bad:#c62828;--warn:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2f353d;--ac:#5aa9f5;--ok:#4cc27a;--bad:#ff7b72;--warn:#e3a33b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2f353d;--ac:#5aa9f5;--ok:#4cc27a;--bad:#ff7b72;--warn:#e3a33b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding:12px;max-width:900px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input.big{flex:1;min-width:180px;font-size:17px;direction:ltr;text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st{background:var(--bg);border-radius:10px;padding:8px 10px}.st b{display:block;font-size:20px}.st span{color:var(--mu);font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.msg{padding:9px 12px;border-radius:8px;margin-top:8px;font-weight:600}
.msg.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.msg.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.msg.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:12px}
.mu{color:var(--mu);font-size:12px}.ltr{direction:ltr;unicode-bidi:embed}
.q{display:flex;align-items:center;gap:4px}.q button{padding:4px 10px}.q input{width:60px;text-align:center;padding:5px}
.good{color:var(--ok)}tr.rbad td{background:color-mix(in srgb,var(--bad) 24%,transparent)}tr.rwarn td{background:color-mix(in srgb,var(--warn) 24%,transparent)}tr.rdone td{background:color-mix(in srgb,var(--ok) 26%,transparent)}.badc{color:var(--bad)}
.hide{display:none}.btn{cursor:pointer;border-radius:8px;padding:9px 12px;border:1px solid var(--ac);background:var(--ac);color:#fff;display:inline-block}details summary{cursor:pointer}
</style>
</head>
<body>
<h1>📦 جرد المخزون</h1>

<div class="card">
  <div class="row">
    <label class="btn" for="f">استيراد ملف المخزون</label>
    <input type="file" id="f" class="hide" accept=".xls,.xlsx,.csv,.html,.htm">
    <select id="sub"></select>
    <span id="fn" class="mu"></span>
  </div>
  <div id="imsg"></div>
</div>

<div id="app" class="hide">
  <div class="card"><div class="stats" id="stats"></div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="fin" style="width:auto"> إنهاء الجرد (تظليل كل الناقص بالأحمر)</label></div>
  <div class="tabs">
    <button id="t1" class="on">الأجهزة (السريال)</button>
    <button id="t2">الإكسسوارات (العدد)</button>
    <button id="t3">التقرير</button><button id="t4">ليست للجرد</button>
  </div>

  <div id="p1">
    <div class="card">
      <div class="row"><input id="ser" class="big" placeholder="امسح أو اكتب السريال ثم Enter" autocomplete="off" inputmode="text"><button class="p" id="sb">تسجيل</button><button id="cb">📷 كاميرا</button><button id="ub">↩ تراجع</button></div><div id="cw" class="hide" style="margin-top:8px"><video id="cv" playsinline muted style="width:100%;max-height:240px;border-radius:8px;background:#000"></video></div>
      <div id="smsg"></div>
    </div>
    <div class="card hide" id="xcard"><b>سيريالات زائدة (غير موجودة في الملف)</b><div class="mu">اكتب اسم الجهاز ليُسجَّل في التقرير</div><div id="xtra"></div></div>
    <div class="card"><div class="tw" id="dev"></div></div>
  </div>

  <div id="p2" class="hide"><div class="card"><div class="row" style="margin-bottom:8px"><input id="aq" placeholder="بحث..." style="flex:1"></div><div class="tw" id="acc"></div></div></div>

  <div id="p4" class="hide"><div class="card"><b>منتجات ليست بحاجة للجرد</b><div class="mu">راجعها للتأكد أنه لم يُستثنَ شيء مهم. اضغط "إرجاع للجرد" لنقل أي منتج إلى قوائم الجرد.</div><div class="tw" id="ex" style="margin-top:8px"></div></div></div>
  <div id="p3" class="hide">
    <div class="card"><div id="rep"></div>
      <div class="row" style="margin-top:10px"><button class="p" id="eb">تصدير النتائج إلى Excel</button><button id="rb" style="color:var(--bad)">تصفير الجرد</button></div>
    </div>
  </div>
</div>

<script>
var KEY='stk_inv_v1', D=null, S={dev:{},extra:{},acc:{}}, curTab=1;
var $=function(i){return document.getElementById(i)};
function nz(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
function isEx(x){var k=nz(x.d);return IGN[k]&&!(S.rest||{})[k]}
var IGC=0,IGN={};['Jawwy EVO ZERO','SAWA/QUICKnet prepaid TrioSIM','ALJAWAL,NANO/SIM,Multi-Sim','eSIM QR code voucher','Jawwy Generic SIM ZERO','eSIM MultiSIM QR code voucher'].forEach(function(x){IGN[nz(x)]=1});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function clean(v){v=String(v==null?'':v).trim();var m=v.match(/^="(.*)"$/);return (m?m[1]:v).trim()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({D:D,S:S}))}catch(e){$('imsg').innerHTML='<div class="msg warn">تعذّر الحفظ التلقائي في المتصفح. صدّر النتائج بانتظام.</div>'}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);D=o.D;S=o.S;S.extra=S.extra||{};Object.keys(S.extra).forEach(function(k){if(typeof S.extra[k]!=='object')S.extra[k]={t:S.extra[k],name:''}});if(D&&D.items)D.items=D.items.filter(function(x){return x.s&&!/days/i.test(x.s)})}}catch(e){}}

function rowsFromHtml(txt){
  var doc=new DOMParser().parseFromString(txt,'text/html'),best=[];
  doc.querySelectorAll('table').forEach(function(t){
    var rs=[].map.call(t.rows,function(r){return[].map.call(r.cells,function(c){return c.textContent})});
    if(rs.length>best.length)best=rs});
  return best}
function parseRows(rows){
  var hi=-1;
  for(var i=0;i<rows.length;i++){if(/subinventory/i.test(clean(rows[i][0]))){hi=i}
    if(hi>=0&&i>hi&&!/subinventory/i.test(clean(rows[i][0])))break}
  if(hi<0)throw new Error('لم أجد صف العناوين (Subinventory Code).');
  var h=rows[hi].map(function(x){return clean(x).toLowerCase()});
  var ix=function(n){return h.indexOf(n)};
  var c={sub:ix('subinventory code'),desc:ix('item description'),ser:ix('serial number'),q:ix('quantity'),cat:ix('item category'),code:ix('item code')};
  if(c.sub<0||c.desc<0||c.ser<0||c.q<0)throw new Error('الأعمدة المطلوبة غير موجودة: Subinventory Code / Item Description / Serial Number / Quantity');
  var out=[];IGC=0;
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i],sub=clean(r[c.sub]);
    if(!sub||/subinventory/i.test(sub)||/days/i.test(sub))continue;
    if(IGN[nz(clean(r[c.desc]))])IGC++;
    var ser=clean(r[c.ser]),q=parseFloat(clean(r[c.q]))||0;
    out.push({s:sub,d:clean(r[c.desc]),n:ser.toUpperCase(),q:ser?1:q,c:c.cat>=0?clean(r[c.cat]):'',k:c.code>=0?clean(r[c.code]):''})}
  return out}
$('f').onchange=function(e){
  var file=e.target.files[0];if(!file)return;
  $('imsg').innerHTML='<div class="msg warn">جاري قراءة الملف...</div>';
  var rd=new FileReader();
  rd.onload=function(){
    setTimeout(function(){try{
      var buf=rd.result,head=new TextDecoder().decode(new Uint8Array(buf,0,400)),rows;
      if(/<html|<table/i.test(head))rows=rowsFromHtml(new TextDecoder().decode(buf));
      else{var wb=XLSX.read(buf,{type:'array'}),best=[];
        wb.SheetNames.forEach(function(n){var r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});if(r.length>best.length)best=r});rows=best}
      var items=parseRows(rows);
      if(!items.length)throw new Error('لا توجد بيانات.');
      if(D&&(Object.keys(S.dev).length||Object.keys(S.acc).length)&&!confirm('يوجد جرد سابق. الاستيراد سيمسح نتائجه. هل تريد المتابعة؟')){$('imsg').innerHTML='';return}
      D={file:file.name,items:items};S={dev:{},extra:{},acc:{},rest:(S&&S.rest)||{}};save();
      var cnt=items.filter(function(x){return!isEx(x)}),nd=cnt.filter(function(x){return x.n}).length;
      $('imsg').innerHTML='<div class="msg ok">تم استيراد '+cnt.length+' سطر للجرد: '+nd+' جهاز بسريال و'+(cnt.length-nd)+' صنف إكسسوار. وُضع '+IGC+' سطر في قائمة "ليست بحاجة للجرد" للمراجعة.</div>';
      init()}catch(err){$('imsg').innerHTML='<div class="msg bad">'+esc(err.message)+'</div>'}},30)};
  rd.readAsArrayBuffer(file);$('f').value=''};

function init(){
  if(!D)return;$('fin').checked=!!S.fin;$('app').classList.remove('hide');$('fn').textContent=D.file;
  var subs=[];D.items.forEach(function(x){if(!isEx(x)&&subs.indexOf(x.s)<0)subs.push(x.s)});subs.sort();
  var cur=$('sub').value;
  $('sub').innerHTML='<option value="">كل المواقع</option>'+subs.map(function(s){return'<option>'+esc(s)+'</option>'}).join('');
  $('sub').value=subs.indexOf(cur)>=0?cur:'';render()}
function tab(n){curTab=n;if(n!==1&&cam.on)camStop();[1,2,3,4].forEach(function(i){$('p'+i).classList.toggle('hide',i!==n);$('t'+i).classList.toggle('on',i===n)});render();if(n===1)$('ser').focus()}
function sel(){var s=$('sub').value;return D.items.filter(function(x){return(!s||x.s===s)&&!isEx(x)})}
function accKey(x){return x.s+'|'+x.k+'|'+x.d}

function scan(val){
  var v=clean(val!=null?val:$('ser').value).toUpperCase();$('ser').value='';if(!v)return;
  var m=D.items.filter(function(x){return x.n===v})[0],h;
  if(!m&&v.length>1&&v.charAt(0)==='S'){v=v.slice(1);m=D.items.filter(function(x){return x.n===v})[0]}
  if(!m){if(S.extra[v])h='<div class="msg warn">سريال زائد مُسجَّل مسبقاً: '+esc(v)+'</div>';else{S.extra[v]={t:Date.now(),name:''};hist('e',v);h='<div class="msg bad">⚠ السريال '+esc(v)+' غير موجود في الملف (زائد). اكتب اسم الجهاز في الخانة الحمراء أدناه.</div>'}}
  else if(isEx(m)){h='<div class="msg warn">هذا المنتج ضمن "ليست بحاجة للجرد" ولم يُسجَّل: '+esc(m.d)+'</div>'}else if(S.dev[v]){h='<div class="msg warn">مُسجَّل مسبقاً: '+esc(m.d)+'</div>'}
  else{S.dev[v]=Date.now();hist('d',v);h='<div class="msg ok">✔ '+esc(m.d)+' <span class="mu">('+esc(m.s)+')</span></div>';
    var sb=$('sub').value;if(sb&&m.s!==sb)h+='<div class="msg warn">هذا الجهاز مسجّل في موقع آخر: '+esc(m.s)+'</div>'}
  $('smsg').innerHTML=h;save();render();$('ser').focus()}
$('ser').addEventListener('keydown',function(e){if(e.key==='Enter')scan()});
function setAcc(k,v){v=Math.max(0,parseInt(v)||0);S.acc[k]=v;save();render(true)}

function render(keep){
  if(!D)return;renderX();var it=sel(),dv=it.filter(function(x){return x.n}),ac=it.filter(function(x){return!x.n});
  var found=dv.filter(function(x){return S.dev[x.n]}).length;
  var aE=0,aC=0;ac.forEach(function(x){aE+=x.q;aC+=Math.min(S.acc[accKey(x)]||0,1e9)});
  var pct=dv.length?Math.round(found/dv.length*100):0;
  $('stats').innerHTML=[['الأجهزة المجرودة',found+' / '+dv.length],['الأجهزة الناقصة',dv.length-found],['سريال زائد',Object.keys(S.extra).length],['الإكسسوارات (عدّ / متوقع)',aC+' / '+aE]].map(function(a){return'<div class="st"><b>'+a[1]+'</b><span>'+a[0]+'</span></div>'}).join('')+'<div class="st" style="grid-column:1/-1"><span>تقدم جرد الأجهزة '+pct+'%</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  if(curTab===1){
    var g={};dv.forEach(function(x){var k=x.s+'|'+x.d;(g[k]=g[k]||{s:x.s,d:x.d,a:[]}).a.push(x)});
    var ks=Object.keys(g).sort(function(a,b){var A=g[a],B=g[b];return(B.a.length-B.a.filter(function(x){return S.dev[x.n]}).length)-(A.a.length-A.a.filter(function(x){return S.dev[x.n]}).length)});
    var h='<table><tr><th>الجهاز</th><th>الموقع</th><th>مجرود / متوقع</th></tr>';
    ks.forEach(function(k){var G=g[k],c=G.a.filter(function(x){return S.dev[x.n]}).length,done=c===G.a.length;
      h+='<tr'+(done?' class="rdone"':((S.fin||c>0)?' class="rbad"':''))+'><td><details><summary>'+esc(G.d)+'</summary><div class="ltr mu">'+G.a.map(function(x){return S.dev[x.n]?'<div>✔ '+esc(x.n)+' <button data-un="'+esc(x.n)+'" style="padding:1px 8px;color:var(--bad)">✕ إلغاء</button></div>':'<div>✘ '+esc(x.n)+'</div>'}).join('')+'</div></details></td><td class="mu">'+esc(G.s)+'</td><td class="'+(done?'good':'')+'">'+c+' / '+G.a.length+'</td></tr>'});
    $('dev').innerHTML=h+'</table>';
  }
  if(curTab===2&&!keep||curTab===2&&keep){
    var q=$('aq').value.toLowerCase(),h2='<table><tr><th>الإكسسوار</th><th>الموقع</th><th>المتوقع</th><th>المعدود</th></tr>';
    ac.filter(function(x){return!q||(x.d+x.k).toLowerCase().indexOf(q)>=0}).forEach(function(x){var k=accKey(x),c=S.acc[k],ek=esc(k).replace(/'/g,'&#39;');
      var diff=c==null?'':(c===x.q?'good':'badc');
      h2+='<tr'+(c!=null&&c===x.q?' class="rdone"':(c==null?(S.fin?' class="rbad"':''):(c<x.q?' class="rbad"':' class="rwarn"')))+'><td>'+esc(x.d)+'<div class="mu ltr">'+esc(x.k)+'</div></td><td class="mu">'+esc(x.s)+'</td><td>'+x.q+'</td><td><div class="q"><button data-k="'+ek+'" data-d="-1">−</button><input type="number" min="0" class="'+diff+'" value="'+(c==null?'':c)+'" data-k="'+ek+'" placeholder="—"><button data-k="'+ek+'" data-d="1">+</button></div></td></tr>'});
    $('acc').innerHTML=h2+'</table>';
  }
  if(curTab===4){var g1={},g2={};
  D.items.forEach(function(x){var k=nz(x.d);if(!IGN[k])return;var g=(S.rest||{})[k]?g2:g1;var o=g[k]=g[k]||{d:x.d,n:0,s:{}};o.n+=x.q||1;o.s[x.s]=1});
  var rw=function(g,lbl,at){return Object.keys(g).map(function(k){var o=g[k];return'<tr><td>'+esc(o.d)+'<div class="mu ltr">'+Object.keys(o.s).map(esc).join(' · ')+'</div></td><td>'+o.n+'</td><td><button '+at+'="'+esc(k)+'">'+lbl+'</button></td></tr>'}).join('')};
  var h4='<table><tr><th>الصنف</th><th>العدد</th><th></th></tr>'+(rw(g1,'إرجاع للجرد','data-r')||'<tr><td colspan="3" class="mu">لا توجد منتجات مستثناة.</td></tr>')+'</table>';
  if(Object.keys(g2).length)h4+='<p><b>أُعيدت للجرد</b></p><table>'+rw(g2,'استثناء مجدداً','data-x')+'</table>';
  $('ex').innerHTML=h4}
  if(curTab===3){
    var miss=dv.filter(function(x){return!S.dev[x.n]}),ad=ac.filter(function(x){return S.acc[accKey(x)]!=null&&S.acc[accKey(x)]!==x.q}),un=ac.filter(function(x){return S.acc[accKey(x)]==null});
    $('rep').innerHTML='<p>أجهزة ناقصة: <b class="badc">'+miss.length+'</b> — سريال زائد: <b class="badc">'+Object.keys(S.extra).length+'</b> — إكسسوارات بها فرق: <b class="badc">'+ad.length+'</b> — إكسسوارات لم تُعدّ: <b>'+un.length+'</b></p>'+(Object.keys(S.extra).length?'<details open><summary>السيريالات الزائدة</summary><div class="ltr">'+Object.keys(S.extra).map(function(s){return esc(s)+' — '+esc(S.extra[s].name||'بدون اسم')}).join('<br>')+'</div></details>':'');
  }
}
$('acc').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-k');setAcc(k,(S.acc[k]||0)+parseInt(b.getAttribute('data-d')))});
$('acc').addEventListener('change',function(e){var i=e.target;if(i.tagName==='INPUT')setAcc(i.getAttribute('data-k'),i.value)});

function exp(){
  var it=sel(),mis=[],ext=[],acc=[];
  it.forEach(function(x){if(x.n){if(!S.dev[x.n])mis.push({'الموقع':x.s,'الجهاز':x.d,'السريال':x.n})}
    else{var c=S.acc[accKey(x)];acc.push({'الموقع':x.s,'الإكسسوار':x.d,'الكود':x.k,'المتوقع':x.q,'المعدود':c==null?'':c,'الفرق':c==null?'':c-x.q})}});
  Object.keys(S.extra).forEach(function(s){ext.push({'السريال الزائد':s})});
  var wb=XLSX.utils.book_new();
  [['أجهزة ناقصة',mis],['سريال زائد',ext],['الإكسسوارات',acc]].forEach(function(p){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(p[1].length?p[1]:[{'—':'لا يوجد'}]),p[0])});
  XLSX.writeFile(wb,'inventory-count-result.xlsx')}
function reset(){if(confirm('مسح كل نتائج الجرد الحالية (ملف المخزون يبقى)؟')){S={dev:{},extra:{},acc:{},rest:S.rest||{}};save();$('smsg').innerHTML='';render()}}
window.onerror=function(m){var e=$('imsg');if(e)e.innerHTML='<div class="msg bad">خطأ: '+esc(m)+'</div>'};
$('sub').onchange=function(){render()};$('aq').oninput=function(){render()};
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};$('t3').onclick=function(){tab(3)};
$('sb').onclick=function(){scan()};
var lastT=0,fast=true,tm;
$('ser').addEventListener('input',function(e){var n=Date.now(),L=this.value.length;clearTimeout(tm);
 if(e.inputType==='insertFromPaste'&&L>=4){scan();return}
 if(L<=1)fast=true;else if(n-lastT>80)fast=false;lastT=n;
 if(fast&&L>=5)tm=setTimeout(function(){scan()},150)});
var cam={on:false,stream:null,det:null,rd:null,last:'',lt:0};
function camMsg(t){$('smsg').innerHTML='<div class="msg bad">'+t+'</div>'}
function camHit(code){var n=Date.now();if(code===cam.last&&n-cam.lt<2500)return;cam.last=code;cam.lt=n;if(navigator.vibrate)navigator.vibrate(60);scan(code)}
function camLoop(){if(!cam.on||!cam.det)return;cam.det.detect($('cv')).then(function(a){if(a.length)camHit(a[0].rawValue)}).catch(function(){}).then(function(){setTimeout(camLoop,200)})}
function camStop(){cam.on=false;if(cam.rd){try{cam.rd.reset()}catch(e){}cam.rd=null}if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop()});cam.stream=null}$('cv').srcObject=null;$('cw').classList.add('hide');$('cb').textContent='📷 كاميرا'}
function camStart(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camMsg('المتصفح لا يسمح بالكاميرا هنا. افتح الموقع في Chrome أو Safari مباشرة.');return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(st){
  cam.stream=st;var v=$('cv');v.srcObject=st;$('cw').classList.remove('hide');cam.on=true;$('cb').textContent='⏹ إيقاف الكاميرا';
  return v.play().then(function(){
   if('BarcodeDetector' in window){cam.det=new BarcodeDetector();camLoop()}
   else if(window.ZXing){cam.rd=new ZXing.BrowserMultiFormatReader();cam.rd.decodeFromVideoElement(v,function(res){if(res)camHit(res.getText())})}
   else{camStop();camMsg('مسح الباركود بالكاميرا غير مدعوم في هذا المتصفح.')}})
 }).catch(function(e){camStop();camMsg('تعذّر فتح الكاميرا: '+esc(e.message||e.name)+'. اسمح للموقع باستخدام الكاميرا.')})}
$('cb').onclick=function(){cam.on?camStop():camStart()};function exportFinal(){
 if(typeof XLSX==='undefined'){alert('مكتبة Excel لم تتحمّل. تحتاج إنترنت للتصدير.');return}
 var it=sel(),rows=[],T={dev:0,found:0,miss:0,acc:0,accOk:0,accDiff:0,accNone:0};
 it.forEach(function(x){
  if(x.n){var f=!!S.dev[x.n];T.dev++;f?T.found++:T.miss++;
   rows.push({'الموقع':x.s,'النوع':'جهاز','الصنف':x.d,'السريال':x.n,'المتوقع':1,'المعدود':f?1:0,'الفرق':f?0:-1,'الحالة':f?'مجرود':'ناقص'})}
  else{var c=S.acc[accKey(x)],st,df='';T.acc++;
   if(c==null){st='لم يُعدّ';T.accNone++}else{df=c-x.q;st=df===0?'مطابق':(df<0?'ناقص':'زائد');df===0?T.accOk++:T.accDiff++}
   rows.push({'الموقع':x.s,'النوع':'إكسسوار','الصنف':x.d,'السريال':'','المتوقع':x.q,'المعدود':c==null?'':c,'الفرق':df,'الحالة':st})}});
 var ex=Object.keys(S.extra);
 ex.forEach(function(s){rows.push({'الموقع':'','النوع':'جهاز','الصنف':(S.extra[s].name||'غير موجود في ملف المخزون - بدون اسم'),'السريال':s,'المتوقع':0,'المعدود':1,'الفرق':1,'الحالة':'زائد'})});
 var d=new Date(),ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
 var sm=[['الملف المستورد',D.file],['الموقع',$('sub').value||'كل المواقع'],['تاريخ الجرد',ds],['',''],['الأجهزة المتوقعة',T.dev],['الأجهزة المجرودة',T.found],['الأجهزة الناقصة',T.miss],['سيريال زائد',ex.length],['',''],['أصناف الإكسسوارات',T.acc],['مطابقة',T.accOk],['بها فرق',T.accDiff],['لم تُعدّ',T.accNone]];
 var wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(sm),w2=XLSX.utils.json_to_sheet(rows.length?rows:[{'—':'لا يوجد'}]);
 w1['!cols']=[{wch:26},{wch:36}];w2['!cols']=[{wch:14},{wch:10},{wch:42},{wch:24},{wch:10},{wch:10},{wch:8},{wch:12}];
 var bad=rows.filter(function(r){return r['الحالة']!=='مجرود'&&r['الحالة']!=='مطابق'}),w3=XLSX.utils.json_to_sheet(bad.length?bad:[{'—':'لا يوجد'}]);w3['!cols']=w2['!cols'];
 XLSX.utils.book_append_sheet(wb,w1,'الملخص');XLSX.utils.book_append_sheet(wb,w2,'الجرد النهائي');XLSX.utils.book_append_sheet(wb,w3,'الفروقات فقط');
 var eg={};D.items.filter(isEx).forEach(function(x){var k=nz(x.d);(eg[k]=eg[k]||{'الصنف':x.d,'العدد':0})['العدد']+=x.q||1});
 var er=Object.keys(eg).map(function(k){return eg[k]});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(er.length?er:[{'—':'لا يوجد'}]),'ليست بحاجة للجرد');
 wb.Workbook={Views:[{RTL:true}]};
 XLSX.writeFile(wb,'inventory-final-'+ds+'.xlsx')}
$('eb').onclick=exportFinal;
function renderX(){var ks=Object.keys(S.extra);$('xcard').classList.toggle('hide',!ks.length);
 $('xtra').innerHTML=ks.map(function(s){var nm=(S.extra[s]||{}).name||'';return '<div class="row" style="margin-top:6px"><span class="ltr" style="min-width:130px">'+esc(s)+'</span><input data-s="'+esc(s)+'" value="'+esc(nm)+'" placeholder="اسم الجهاز" style="flex:1;min-width:140px;'+(nm?'':'border-color:var(--bad)')+'"><button data-del="'+esc(s)+'">✕</button></div>'}).join('')}
$('xtra').addEventListener('input',function(e){var i=e.target,s=i.getAttribute('data-s');if(s&&S.extra[s]){S.extra[s].name=i.value;i.style.borderColor=i.value?'':'var(--bad)';save()}});
$('fin').onchange=function(){S.fin=this.checked;save();render()};
$('t4').onclick=function(){tab(4)};
$('ex').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.rest=S.rest||{};var r=b.getAttribute('data-r'),x=b.getAttribute('data-x');if(r)S.rest[r]=1;if(x)delete S.rest[x];save();init()});
function hist(t,s){S.h=S.h||[];S.h.push({t:t,s:s});if(S.h.length>300)S.h.shift()}
function undo(){var m='';while(S.h&&S.h.length){var e=S.h.pop();
 if(e.t==='d'&&S.dev[e.s]){delete S.dev[e.s];m='تم التراجع عن جرد: '+e.s;break}
 if(e.t==='e'&&S.extra[e.s]){delete S.extra[e.s];m='تم التراجع عن السريال الزائد: '+e.s;break}}
 $('smsg').innerHTML=m?'<div class="msg warn">↩ '+esc(m)+'</div>':'<div class="msg warn">لا يوجد شيء للتراجع عنه.</div>';save();render();$('ser').focus()}
$('ub').onclick=undo;
$('xtra').addEventListener('click',function(e){var b=e.target.closest('button'),s=b&&b.getAttribute('data-del');if(s){delete S.extra[s];save();render()}});
$('dev').addEventListener('click',function(e){var b=e.target.closest('button'),s=b&&b.getAttribute('data-un');if(s&&confirm('إلغاء جرد هذا السريال؟\n'+s)){delete S.dev[s];save();render()}});$('rb').onclick=reset;
load();init();
</script>
